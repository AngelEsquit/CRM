# Comment

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: software-frontend-dev
    environment:
      VITE_BACKEND_URL: "http://localhost:4000"
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules

  backend:
    build:
      context: ./software-backend
      dockerfile: Dockerfile.dev
    container_name: software-backend-dev
    ports:
      - "4000:4000"
    volumes:
      - ./software-backend:/app:Z

    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:admin123@db:5432/oftalcrm?sslmode=disable
      - JWT_SECRET=OkM8ombEEyIkpqmIkMYg48DixlX8xthGFXmjmdw1bf8

    depends_on:
      db:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: minio-s3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data:Z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./sample-files:/sample-files:ro,Z
      - ./scripts:/scripts:ro,Z
    entrypoint: /scripts/init-minio.sh
    restart: "no"

  db:
    image: postgres:latest
    container_name: software-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=oftalcrm
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin123
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/backup.sql:/docker-entrypoint-initdb.d/01_backup.sql:Z
      - ./database/data_insertion.sql:/docker-entrypoint-initdb.d/02_data_insertion.sql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oftalcrm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  minio_data:
    driver: local
