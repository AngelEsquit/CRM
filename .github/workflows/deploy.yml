name: Deploy Prod

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./software-backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.8"
      - name: Install dependencies
        run: go mod tidy
      - name: Run backend tests
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run frontend tests
        run: npm test

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and start all containers
        run: docker compose up -d --build
      - name: Wait for backend to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:4000/healthz; then
              echo "Backend is up!"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          echo "Backend did not become healthy in time."
          exit 1
      - name: Wait for frontend to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080; then
              echo "Frontend is up!"
              break
            fi
            echo "Waiting for frontend..."
            sleep 2
          done
      - name: Run backend integration tests
        run: docker exec software-backend-dev go test ./internal/tests/integration -tags=integration -v
      - name: Fix permissions for Cypress
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }}/frontend
          chmod -R 755 ${{ github.workspace }}/frontend
      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v5
        with:
          working-directory: ./frontend
        env:
          CYPRESS_BASE_URL: http://localhost:8080
          CYPRESS_API_URL: http://localhost:4000
      - name: Tear down
        if: always()
        run: docker compose down -v
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_run:
    workflows: ["Full Stack CI"]
    types:
      - completed

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build --no-cache -t ghcr.io/tonitomc/software-backend:latest -f software-backend/Dockerfile.prod software-backend
          docker push ghcr.io/tonitomc/software-backend:latest

      - name: Build and push frontend image
        run: |
          docker build --no-cache -t ghcr.io/tonitomc/software-frontend:latest -f frontend/Dockerfile.prod frontend
          docker push ghcr.io/tonitomc/software-frontend:latest

      - name: SSH to production server and deploy
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker pull ghcr.io/tonitomc/software-backend:latest
            docker pull ghcr.io/tonitomc/software-frontend:latest
            docker compose -f /home/ubuntu/docker-compose.prod.yml up -d
