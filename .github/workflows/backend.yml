name: Backend Tests

on:
  push:
    paths:
      - "software-backend/**"
  pull_request:
    paths:
      - "software-backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./software-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.8"
      - name: Install dependencies
        run: go mod tidy
      - name: Run backend tests
        run: go test ./...
